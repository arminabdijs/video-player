name: Windows installer

on:
  push:
    branches:
      - "chatgpt/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Aura Player Windows x64 Setup
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare project-local libmpv and SDL2 SDK
        shell: pwsh
        run: |
          .\scripts\Prepare-Windows-SDK.ps1
          "MPV_INCLUDE_DIR=$env:MPV_INCLUDE_DIR" >> $env:GITHUB_ENV
          "MPV_LIB=$env:MPV_LIB" >> $env:GITHUB_ENV
          "MPV_RUNTIME_DIR=$env:MPV_RUNTIME_DIR" >> $env:GITHUB_ENV
          "SDL2_DIR=$env:SDL2_DIR" >> $env:GITHUB_ENV

      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Build and validate embedded native playback runtime
        run: |
          npm run native:build
          npm run codec:diagnose

      - name: Build Windows NSIS installer
        run: npm run desktop:dist:windows:setup

      - name: Validate installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path release -Filter '*-Setup-*-x64.exe' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw 'No Windows x64 NSIS installer was produced.' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "Installer: $($setup.Name)"
          "Size: $([math]::Round($setup.Length / 1MB, 2)) MB"
          "SHA-256: $hash"
          "AURA_SETUP_PATH=$($setup.FullName)" >> $env:GITHUB_ENV
          "AURA_SETUP_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Player-Windows-x64-Setup
          path: release/*-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14