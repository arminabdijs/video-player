<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <title>Video Player</title>
    <link rel="shortcut icon" href="./assets/images/icon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24">
              <path d="M8 5.5v13l10-6.5L8 5.5Z"></path>
            </svg>
          </div>

          <div class="brand-text">
            <strong>Video Player</strong>
            <span>پخش‌کننده ویدیو</span>
          </div>
        </div>

        <button class="header-button" id="changeFileHeader" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v12"></path>
            <path d="m7 8 5-5 5 5"></path>
            <path d="M5 14v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"></path>
          </svg>
          فایل جدید
        </button>
      </header>

      <section class="upload-section" id="uploadSection">
        <input type="file" id="fileInput" accept="video/*,.mp4,.webm,.mkv,.mov,.avi,.m4v,.ogv,.ogg,.mpeg,.mpg,.3gp" hidden />

        <div class="upload-box" id="uploadBox" tabindex="0" role="button" aria-label="انتخاب فایل ویدیو">
          <div class="upload-glow"></div>

          <div class="upload-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 16V4"></path>
              <path d="m7 9 5-5 5 5"></path>
              <path d="M5 20h14"></path>
            </svg>
          </div>

          <h1>ویدیو را انتخاب کنید</h1>

          <p>فایل ویدیویی خود را انتخاب کنید یا آن را اینجا بکشید</p>

          <span class="upload-button">انتخاب فایل</span>

          <small>MP4 · WebM · MKV · MOV · AVI و سایر فرمت‌های پشتیبانی‌شده</small>
        </div>
      </section>

      <section class="player-section" id="playerSection">
        <div class="player" id="player">
          <video id="video" preload="metadata" playsinline></video>

          <div class="video-vignette"></div>

          <div class="video-loading" id="videoLoading">
            <div class="loading-ring"></div>
          </div>

          <button class="center-play" id="centerPlay" type="button" aria-label="پخش و توقف">
            <svg viewBox="0 0 24 24">
              <path d="M8 5v14l11-7L8 5Z"></path>
            </svg>
          </button>

          <div class="player-top" id="playerTop">
            <div class="top-file">
              <div class="top-file-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M5 3h9l5 5v13H5z"></path>
                  <path d="M14 3v6h6"></path>
                </svg>
              </div>

              <div class="top-file-text">
                <span class="top-file-label">در حال پخش</span>
                <strong id="topFileName">Video</strong>
              </div>
            </div>

            <button class="top-change" id="changeFileTop" type="button">تغییر فایل</button>
          </div>

          <div class="controls" id="controls">
            <div class="progress-area" id="progressArea">
              <div class="progress-track" id="progressTrack">
                <div class="buffer-bar" id="bufferBar"></div>
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-thumb" id="progressThumb"></div>
              </div>
            </div>

            <div class="controls-main">
              <div class="controls-right">
                <button class="control-button main-play" id="playBtn" type="button" aria-label="پخش">
                  <svg class="play-icon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7L8 5Z"></path>
                  </svg>

                  <svg class="pause-icon" viewBox="0 0 24 24">
                    <path d="M7 5h4v14H7z"></path>
                    <path d="M13 5h4v14h-4z"></path>
                  </svg>
                </button>

                <button class="control-button skip-button" id="backBtn" type="button" aria-label="10 ثانیه عقب">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 12a8 8 0 1 0 2.35-5.65"></path>
                    <path d="M4 5v5h5"></path>
                    <text x="12" y="15" text-anchor="middle">10</text>
                  </svg>
                </button>

                <button class="control-button skip-button" id="forwardBtn" type="button" aria-label="10 ثانیه جلو">
                  <svg viewBox="0 0 24 24">
                    <path d="M20 12a8 8 0 1 1-2.35-5.65"></path>
                    <path d="M20 5v5h-5"></path>
                    <text x="12" y="15" text-anchor="middle">10</text>
                  </svg>
                </button>

                <div class="volume-control">
                  <button class="control-button" id="muteBtn" type="button" aria-label="صدا">
                    <svg class="volume-on" viewBox="0 0 24 24">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                      <path d="M16 9.5a4 4 0 0 1 0 5"></path>
                      <path d="M18.5 7a8 8 0 0 1 0 10"></path>
                    </svg>

                    <svg class="volume-off" viewBox="0 0 24 24">
                      <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                      <path d="m17 9 4 6"></path>
                      <path d="m21 9-4 6"></path>
                    </svg>
                  </button>

                  <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="1" aria-label="میزان صدا" />
                </div>

                <div class="time">
                  <span id="currentTime">00:00</span>
                  <span>/</span>
                  <span id="duration">00:00</span>
                </div>
              </div>

              <div class="controls-left">
                <div class="speed-wrapper">
                  <button class="speed-button" id="speedBtn" type="button" aria-expanded="false" aria-haspopup="dialog">
                    <span id="speedValue">1x</span>
                    <svg viewBox="0 0 24 24">
                      <path d="m7 10 5 5 5-5"></path>
                    </svg>
                  </button>

                  <div class="speed-menu" id="speedMenu" role="dialog" aria-label="تنظیم سرعت پخش">
                    <div class="speed-header">
                      <div>
                        <span>تنظیم پخش</span>
                        <strong>سرعت ویدیو</strong>
                      </div>

                      <button id="closeSpeed" type="button" aria-label="بستن">×</button>
                    </div>

                    <div class="speed-current">
                      <span id="speedPreview">1</span>
                      <small>x</small>
                    </div>

                    <div class="speed-input-wrap">
                      <input type="number" id="speedInput" min="0.1" max="16" step="0.01" value="1" inputmode="decimal" aria-label="سرعت پخش" />
                      <span>x</span>
                    </div>

                    <div class="speed-range">
                      <input type="range" id="speedRange" min="0.1" max="16" step="0.01" value="1" aria-label="سرعت پخش" />
                    </div>

                    <div class="speed-limits">
                      <span>0.1x</span>
                      <span>16x</span>
                    </div>

                    <button class="apply-speed" id="applySpeed" type="button">اعمال سرعت</button>
                  </div>
                </div>

                <button class="control-button" id="pipBtn" type="button" aria-label="تصویر در تصویر">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <rect x="12" y="12" width="7" height="5" rx="1"></rect>
                  </svg>
                </button>

                <button class="control-button" id="fullscreenBtn" type="button" aria-label="تمام صفحه">
                  <svg class="fullscreen-open" viewBox="0 0 24 24">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M3 16v5h5"></path>
                  </svg>

                  <svg class="fullscreen-close" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="miter">
                    <polyline points="9 3 9 9 3 9" />
                    <polyline points="15 21 15 15 21 15" />
                    <polyline points="3 15 9 15 9 21" />
                    <polyline points="21 9 15 9 15 3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="file-info">
          <div class="file-details">
            <div class="file-name" id="fileName">-</div>

            <div class="file-meta">
              <span id="fileSize">-</span>
              <span>•</span>
              <span id="videoResolution">-</span>
            </div>
          </div>

          <div class="keyboard-hints">
            <div>
              <kbd>Space</kbd>
              <small>پخش</small>
            </div>

            <div>
              <kbd>← →</kbd>
              <small>حرکت</small>
            </div>

            <div>
              <kbd>F</kbd>
              <small>تمام صفحه</small>
            </div>

            <div>
              <kbd>M</kbd>
              <small>صدا</small>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./scripts/script.js"></script>
  </body>
</html>
