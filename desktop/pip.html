<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Aura Player — تصویر در تصویر</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #08090d;
      color: #f7f4fb;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      min-height: 180px;
      margin: 0;
      overflow: hidden;
      background: #08090d;
    }
    body {
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 14px;
    }
    .pip-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
      border-radius: 13px;
      isolation: isolate;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.07);
    }
    #pipCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050608;
    }
    .pip-topbar, .pip-controls {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 150ms ease;
      pointer-events: none;
    }
    .pip-topbar {
      top: 0;
      min-height: 38px;
      padding: 5px 8px 5px 10px;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,0));
      -webkit-app-region: drag;
      cursor: move;
    }
    .pip-controls {
      -webkit-app-region: no-drag;
    }
    .pip-resize-handle {
      position: absolute;
      z-index: 5;
      display: block;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-app-region: no-drag;
    }
    .pip-resize-n, .pip-resize-s {
      left: 14px;
      right: 14px;
      height: 7px;
      cursor: ns-resize;
    }
    .pip-resize-n { top: 0; }
    .pip-resize-s { bottom: 0; }
    .pip-resize-e, .pip-resize-w {
      top: 14px;
      bottom: 14px;
      width: 7px;
      cursor: ew-resize;
    }
    .pip-resize-e { right: 0; }
    .pip-resize-w { left: 0; }
    .pip-resize-ne, .pip-resize-nw, .pip-resize-se, .pip-resize-sw {
      width: 16px;
      height: 16px;
    }
    .pip-resize-ne { top: 0; right: 0; cursor: nesw-resize; }
    .pip-resize-nw { top: 0; left: 0; cursor: nwse-resize; }
    .pip-resize-se { right: 0; bottom: 0; cursor: nwse-resize; }
    .pip-resize-sw { left: 0; bottom: 0; cursor: nesw-resize; }
    .pip-controls {
      bottom: 0;
      min-height: 66px;
      padding: 8px 10px 9px;
      flex-direction: column;
      gap: 6px;
      background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0));
    }
    .pip-shell:hover .pip-topbar,
    .pip-shell:hover .pip-controls,
    .pip-shell:focus-within .pip-topbar,
    .pip-shell:focus-within .pip-controls {
      opacity: 1;
      pointer-events: auto;
    }
    .pip-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: rgba(255,255,255,.92);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .2px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .pip-brand-mark {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 12px rgba(167,139,250,.75);
    }
    .pip-title {
      overflow: hidden;
      max-width: min(62vw, 340px);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .pip-button {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.13);
      cursor: pointer;
      pointer-events: auto;
      -webkit-app-region: no-drag;
      transition: background 120ms ease, transform 120ms ease;
    }
    .pip-button:hover { background: rgba(255,255,255,.24); }
    .pip-button:active { transform: scale(.94); }
    .pip-button:focus-visible, #pipSeek:focus-visible {
      outline: 2px solid #c4b5fd;
      outline-offset: 2px;
    }
    .pip-button svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .pip-main-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      direction: ltr;
    }
    .pip-main-controls .pip-button {
      width: 30px;
      height: 30px;
      background: rgba(255,255,255,.16);
    }
    #pipPlay {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,.24);
    }
    #pipTime {
      min-width: 90px;
      color: rgba(255,255,255,.92);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      direction: ltr;
    }
    #pipSeek {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      accent-color: #c4b5fd;
      cursor: pointer;
      direction: ltr;
      -webkit-app-region: no-drag;
    }
    #pipStatus {
      position: absolute;
      z-index: 1;
      inset: 42px 10px 76px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      text-align: center;
      text-shadow: 0 1px 8px #000;
      pointer-events: none;
    }
    #pipStatus:empty { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .pip-topbar, .pip-controls, .pip-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="pip-shell" aria-label="پخش‌کنندهٔ شناور Aura Player">
    <div class="pip-resize-handle pip-resize-n" data-pip-resize="n" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-s" data-pip-resize="s" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-e" data-pip-resize="e" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-w" data-pip-resize="w" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-ne" data-pip-resize="ne" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-nw" data-pip-resize="nw" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-se" data-pip-resize="se" aria-hidden="true"></div>
    <div class="pip-resize-handle pip-resize-sw" data-pip-resize="sw" aria-hidden="true"></div>
    <canvas id="pipCanvas" aria-label="تصویر ویدئو"></canvas>
    <div class="pip-topbar">
      <div class="pip-brand">
        <span class="pip-brand-mark" aria-hidden="true"></span>
        <span class="pip-title">Aura Player · تصویر در تصویر</span>
      </div>
      <button class="pip-button" id="pipClose" type="button" title="بستن تصویر در تصویر" aria-label="بستن تصویر در تصویر">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4l-6.3 6.3-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </div>
    <div id="pipStatus" role="status" aria-live="polite">در انتظار فریم ویدئو…</div>
    <div class="pip-controls">
      <input id="pipSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="موقعیت پخش">
      <div class="pip-main-controls">
        <button class="pip-button" id="pipBack" type="button" title="۱۰ ثانیه عقب" aria-label="۱۰ ثانیه عقب">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5V1L5 7l6 6V9c3.3 0 6 2.7 6 6a6 6 0 1 1-12 0H3a8 8 0 1 0 8-8z"/></svg>
        </button>
        <button class="pip-button" id="pipPlay" type="button" title="پخش" aria-label="پخش یا توقف">
          <svg id="pipPlayIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="pip-button" id="pipForward" type="button" title="۱۰ ثانیه جلو" aria-label="۱۰ ثانیه جلو">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5V1l6 6-6 6V9c-3.3 0-6 2.7-6 6a6 6 0 1 0 12 0h2a8 8 0 1 1-8-8z"/></svg>
        </button>
        <span id="pipTime">00:00 / 00:00</span>
      </div>
    </div>
  </main>
  <script src="pip.js"></script>
</body>
</html>
